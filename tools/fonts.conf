<?xml version="1.0"?><!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
 <match target="pattern"><test name="family"><string>Segoe UI</string></test><edit name="family" mode="assign" binding="strong"><string>Inter</string></edit></match>
 <match target="pattern"><test name="family"><string>Segoe UI Semibold</string></test><edit name="family" mode="assign" binding="strong"><string>Inter</string></edit><edit name="weight" mode="assign"><const>semibold</const></edit></match>
 <match target="pattern"><test name="family"><string>Segoe UI Light</string></test><edit name="family" mode="assign" binding="strong"><string>Inter</string></edit><edit name="weight" mode="assign"><const>light</const></edit></match>
 <match target="pattern"><test name="family"><string>Segoe UI Semilight</string></test><edit name="family" mode="assign" binding="strong"><string>Inter</string></edit><edit name="weight" mode="assign"><const>light</const></edit></match>
</fontconfig>
